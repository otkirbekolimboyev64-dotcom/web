<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish — O'quv Markaz</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #4cd137 0%, #44bd32 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-box {
            position: relative;
            width: 360px;
            max-width: 100%;
            background: #ffffff;
            padding: 90px 30px 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }
        .panda-container {
            position: absolute;
            top: -95px;
            left: 50%;
            transform: translateX(-50%);
            width: 170px;
            height: 150px;
            pointer-events: none;
        }
        .hidden { display: none !important; }
        .field { margin-bottom: 20px; }
        .field label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #2f3640;
            margin-bottom: 8px;
        }
        .field input {
            width: 100%;
            padding: 14px 16px;
            background: #f1f2f6;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 14px;
            color: #2f3640;
            outline: none;
            transition: all 0.2s ease;
        }
        .field input:focus {
            background: #ffffff;
            border-color: #4cd137;
        }
        .password-wrapper { position: relative; }
        .eye-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #4cd137;
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 6px 15px rgba(76, 209, 55, 0.4);
            transition: background 0.2s, transform 0.1s;
        }
        .btn-login:hover { background: #44bd32; }
        .btn-login:active { transform: scale(0.98); }
        .error {
            background: #ffe0e0;
            color: #d63031;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-box">
    <!-- SVG Panda -->
    <div class="panda-container">
        <svg id="panda" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
            <circle cx="45" cy="45" r="22" fill="#2b2b2b" />
            <circle cx="155" cy="45" r="22" fill="#2b2b2b" />
            <ellipse cx="100" cy="95" rx="75" ry="65" fill="#ffffff" stroke="#2b2b2b" stroke-width="4" />
            <ellipse cx="42" cy="110" rx="12" ry="7" fill="#ff9999" opacity="0.6" />
            <ellipse cx="158" cy="110" rx="12" ry="7" fill="#ff9999" opacity="0.6" />
            <ellipse cx="65" cy="90" rx="20" ry="24" fill="#2b2b2b" transform="rotate(-10 65 90)" />
            <ellipse cx="135" cy="90" rx="20" ry="24" fill="#2b2b2b" transform="rotate(10 135 90)" />
            <g id="open-eyes">
                <circle cx="68" cy="92" r="8" fill="#ffffff" />
                <circle cx="132" cy="92" r="8" fill="#ffffff" />
                <circle id="pupil-left" cx="68" cy="92" r="4" fill="#2b2b2b" />
                <circle id="pupil-right" cx="132" cy="92" r="4" fill="#2b2b2b" />
            </g>
            <g id="closed-eyes" class="hidden">
                <path d="M 55 92 Q 65 82 75 92" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M 125 92 Q 135 82 145 92" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
            </g>
            <ellipse cx="100" cy="105" rx="8" ry="5" fill="#2b2b2b" />
            <path d="M 94 112 Q 100 117 106 112" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round" />
            <g id="paws-normal">
                <path class="paw-base" d="M 15 155 C 15 135, 45 135, 45 155 Z" fill="#2b2b2b" />
                <path class="paw-base" d="M 155 155 C 155 135, 185 135, 185 155 Z" fill="#2b2b2b" />
            </g>
            <g id="paws-cover" class="hidden">
                <g transform="translate(45, 65)">
                    <ellipse cx="20" cy="25" rx="22" ry="26" fill="#2b2b2b" />
                    <ellipse cx="20" cy="32" rx="10" ry="8" fill="#555" />
                    <circle cx="10" cy="15" r="3.5" fill="#555" />
                    <circle cx="20" cy="11" r="3.5" fill="#555" />
                    <circle cx="30" cy="15" r="3.5" fill="#555" />
                </g>
                <g transform="translate(115, 65)">
                    <ellipse cx="20" cy="25" rx="22" ry="26" fill="#2b2b2b" />
                    <ellipse cx="20" cy="32" rx="10" ry="8" fill="#555" />
                    <circle cx="10" cy="15" r="3.5" fill="#555" />
                    <circle cx="20" cy="11" r="3.5" fill="#555" />
                    <circle cx="30" cy="15" r="3.5" fill="#555" />
                </g>
            </g>
        </svg>
    </div>

    <!-- Forma — endi haqiqiy POST /login ga yuboriladi -->
    <form method="post" action="/login">
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <div class="field">
            <label for="username">Login</label>
            <input type="text" id="username" name="username" placeholder="Loginni kiriting..." autocomplete="username" required autofocus>
        </div>

        <div class="field">
            <label for="password">Parol</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" placeholder="Parolni kiriting..." autocomplete="current-password" required>
                <button type="button" id="toggle-password" class="eye-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#718093" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-login">KIRISH</button>
    </form>
</div>

<script>
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('toggle-password');

    const openEyes = document.getElementById('open-eyes');
    const closedEyes = document.getElementById('closed-eyes');
    const pawsNormal = document.getElementById('paws-normal');
    const pawsCover = document.getElementById('paws-cover');

    const pupilLeft = document.getElementById('pupil-left');
    const pupilRight = document.getElementById('pupil-right');

    function coverEyes() {
        openEyes.classList.add('hidden');
        closedEyes.classList.remove('hidden');
        pawsNormal.classList.add('hidden');
        pawsCover.classList.remove('hidden');
    }
    function uncoverEyes() {
        openEyes.classList.remove('hidden');
        closedEyes.classList.add('hidden');
        pawsNormal.classList.remove('hidden');
        pawsCover.classList.add('hidden');
    }

    passwordInput.addEventListener('focus', () => {
        if (passwordInput.type === 'password') coverEyes();
    });
    passwordInput.addEventListener('blur', () => {
        uncoverEyes();
    });

    togglePasswordBtn.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            uncoverEyes();
        } else {
            passwordInput.type = 'password';
            coverEyes();
        }
    });

    usernameInput.addEventListener('input', (e) => {
        const valLength = e.target.value.length;
        const moveX = Math.min(Math.max(valLength - 10, -6), 6);
        pupilLeft.setAttribute('cx', 68 + moveX);
        pupilRight.setAttribute('cx', 132 + moveX);
    });
    usernameInput.addEventListener('blur', () => {
        pupilLeft.setAttribute('cx', 68);
        pupilRight.setAttribute('cx', 132);
    });
</script>
</body>
</html>
