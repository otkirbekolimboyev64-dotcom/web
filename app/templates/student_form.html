{% extends "base.html" %}
{% block title %}O'quvchi{% endblock %}
{% block content %}
<h2>{{ 'Tahrirlash' if student else 'Yangi o\'quvchi' }}</h2>
<form method="post" class="mt-3" style="max-width:600px;"
      action="{{ '/admin/students/' + student.id|string + '/edit' if student else '/admin/students/new' }}">
    <div class="mb-3"><label class="form-label">F.I.Sh *</label>
        <input type="text" name="full_name" class="form-control" required value="{{ student.full_name if student else '' }}"></div>
    <div class="mb-3"><label class="form-label">Ota-ona telefoni *</label>
        <input type="text" name="parent_phone" class="form-control" required value="{{ student.parent_phone if student else '' }}"></div>
    
    <div class="mb-3"><label class="form-label">Guruh *</label>
        <select name="group_id" class="form-select" required>
            <option value="">Tanlang...</option>
            {% for g in groups %}
            <option value="{{ g.id }}" {{ 'selected' if student and student.group_id == g.id else '' }}>
                {{ g.name }} ({{ g.course.name }})
            </option>
            {% endfor %}
        </select></div>
        
    <div class="mb-3"><label class="form-label">Oylik to'lov *</label>
        <input type="number" name="monthly_fee" class="form-control" required value="{{ student.monthly_fee if student else '' }}"></div>
    <div class="mb-3"><label class="form-label">Telegram ID</label>
        <input type="text" name="telegram_id" class="form-control" value="{{ student.telegram_id if student else '' }}"></div>
    <button class="btn btn-primary">Saqlash</button>
    <a href="/admin/students" class="btn btn-secondary">Bekor qilish</a>
</form>
{% endblock %}
