{% extends "base.html" %}
{% block title %}{{ 'Tahrirlash' if student else 'Yangi' }}{% endblock %}
{% block content %}
<h2>{{ 'Tahrirlash' if student else 'Yangi o\'quvchi' }}</h2>
<form method="post" class="mt-3" style="max-width:600px;"
      action="{{ '/admin/students/' + student.id|string + '/edit' if student else '/admin/students/new' }}">
    <div class="mb-3"><label class="form-label">F.I.Sh *</label>
        <input type="text" name="full_name" class="form-control" required
               value="{{ student.full_name if student else '' }}"></div>
    <div class="mb-3"><label class="form-label">O'quvchi telefoni</label>
        <input type="text" name="phone" class="form-control"
               value="{{ student.phone if student else '' }}"></div>
    <div class="mb-3"><label class="form-label">Ota-ona ismi</label>
        <input type="text" name="parent_name" class="form-control"
               value="{{ student.parent_name if student else '' }}"></div>
    <div class="mb-3"><label class="form-label">Ota-ona telefoni *</label>
        <input type="text" name="parent_phone" class="form-control" required
               placeholder="+998901234567"
               value="{{ student.parent_phone if student else '' }}"></div>
    <div class="mb-3"><label class="form-label">Kurs *</label>
        <select name="course_id" class="form-select" required>
            <option value="">Tanlang...</option>
            {% for c in courses %}
            <option value="{{ c.id }}"
                {{ 'selected' if student and student.course_id == c.id else '' }}>
                {{ c.name }} ({{ "{:,.0f}".format(c.price) }} so'm)
            </option>
            {% endfor %}
        </select></div>
    <div class="mb-3"><label class="form-label">Guruh nomi</label>
        <input type="text" name="group_name" class="form-control"
               value="{{ student.group_name if student else '' }}"></div>
    <div class="mb-3"><label class="form-label">Oylik to'lov *</label>
        <input type="number" name="monthly_fee" class="form-control" required
               value="{{ student.monthly_fee if student else '' }}"></div>
    <div class="mb-3"><label class="form-label">Telegram ID (ota-ona)</label>
        <input type="text" name="telegram_id" class="form-control"
               placeholder="Bot /start da ko'rsatilgan ID"
               value="{{ student.telegram_id if student else '' }}"></div>
    <button class="btn btn-primary">Saqlash</button>
    <a href="/admin/students" class="btn btn-secondary">Bekor qilish</a>
</form>
{% endblock %}
